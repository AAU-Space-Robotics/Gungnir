joy_node:
  ros__parameters:
    deadzone: 0.05
    autorepeat_rate: 30.0
    coalesce_interval_ms: 1

joystick_servo:
  ros__parameters:
    # Xbox-compatible Linux mapping. Hold the left bumper for Cartesian jogging
    # or the right bumper for joint jogging. Pressing both stops the robot.
    deadman_button: 4
    joint_deadman_button: 5
    deadzone: 0.1
    command_frame: link_1
    auto_start_servo: true

    # Servo is configured for unitless input, so these values must remain in [-1, 1].
    linear_x.axis: 1
    linear_x.scale: 1.0
    linear_y.axis: 0
    linear_y.scale: 1.0
    linear_z.axis: 4
    linear_z.scale: 1.0

    # A 3-DOF arm cannot independently control all six Cartesian dimensions, so
    # orientation commands are disabled until the wrist joints are implemented.
    angular_x.axis: -1
    angular_x.scale: 0.0
    angular_y.axis: -1
    angular_y.scale: 0.0
    angular_z.axis: -1
    angular_z.scale: 0.0

    # Each list entry describes the same joint. Joint jog values are unitless
    # because Servo's command_in_type is configured as "unitless".
    joint_names: [joint_1, joint_2, joint_3]
    joint_axes: [0, 1, 4]
    joint_scales: [1.0, 1.0, 1.0]
